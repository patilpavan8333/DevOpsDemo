name: .NET CI-CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Publish application
        run: dotnet publish --configuration Release --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevOpsDemo-app
          path: ./publish

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: DevOpsDemo-app
          path: ./publish

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Azure VM
        run: |
          scp -r ./publish/* "${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }}:/var/www/devopsdemo/"

      - name: Restart application
        run: |
          ssh "${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }}" \
          "sudo systemctl restart devopsdemo && sudo systemctl status devopsdemo --no-pager"
